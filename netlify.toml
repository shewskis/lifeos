# Netlify continuous deploy: the app is static, nothing to build.
[build]
  publish = "lifeos"
  command = ""

# Never cache the service worker or the HTML shell; the SW handles asset caching itself.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
